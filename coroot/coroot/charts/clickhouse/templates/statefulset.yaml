---
# Source: coroot/charts/clickhouse/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coroot-clickhouse-shard0
  namespace: "coroot"
  labels:
    app.kubernetes.io/name: clickhouse
    helm.sh/chart: clickhouse-3.1.6
    app.kubernetes.io/instance: coroot
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: clickhouse
spec:
  replicas: 1
  podManagementPolicy: "Parallel"
  selector:
    matchLabels: 
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/instance: coroot
      app.kubernetes.io/component: clickhouse
  serviceName: coroot-clickhouse-headless
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: 2aeb69c9ccb18c79c2c05a52bd8ce9f9924006999ea48b64437f5973d4b749d1
        checksum/config-extra: a9676678ba32468eec320198b43bb17b2dbab1965a2fdfb7a5651fa83f0a05dd
      labels:
        app.kubernetes.io/name: clickhouse
        helm.sh/chart: clickhouse-3.1.6
        app.kubernetes.io/instance: coroot
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: clickhouse
    spec:
      serviceAccountName: coroot-clickhouse
      
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: clickhouse
                    app.kubernetes.io/instance: coroot
                    app.kubernetes.io/component: clickhouse
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      containers:
        - name: clickhouse
          image: docker.io/bitnami/clickhouse:24.12.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 1001
          command:
            - /scripts/setup.sh
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: CLICKHOUSE_HTTP_PORT
              value: "8123"
            - name: CLICKHOUSE_TCP_PORT
              value: "9000"
            - name: CLICKHOUSE_MYSQL_PORT
              value: "9004"
            - name: CLICKHOUSE_POSTGRESQL_PORT
              value: "9005"
            - name: CLICKHOUSE_INTERSERVER_HTTP_PORT
              value: "9009"
            - name: CLICKHOUSE_ADMIN_USER
              value: "default"
            - name: CLICKHOUSE_SHARD_ID
              value: "shard0"
            - name: CLICKHOUSE_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coroot-clickhouse
                  key: admin-password
          envFrom:
          resources:
            limits: {}
            requests: {}
          ports:
            - name: http
              containerPort: 8123
            - name: tcp
              containerPort: 9000
            - name: tcp-postgresql
              containerPort: 9005
            - name: tcp-mysql
              containerPort: 9004
            - name: http-intersrv
              containerPort: 9009
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
            httpGet:
              path: /ping
              port: http
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: scripts
              mountPath: /scripts/setup.sh
              subPath: setup.sh
            - name: data
              mountPath: /bitnami/clickhouse
            - name: config
              mountPath: /bitnami/clickhouse/etc/conf.d/default
            - name: extra-config
              mountPath: /bitnami/clickhouse/etc/conf.d/extra-configmap
      volumes:
        - name: scripts
          configMap:
            name: coroot-clickhouse-scripts
            defaultMode: 0755
        - name: config
          configMap:
            name: coroot-clickhouse
        - name: extra-config
          configMap:
            name: coroot-clickhouse-extra
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
        labels:
          app.kubernetes.io/name: clickhouse
          helm.sh/chart: clickhouse-3.1.6
          app.kubernetes.io/instance: coroot
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/component: clickhouse
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "50Gi"
