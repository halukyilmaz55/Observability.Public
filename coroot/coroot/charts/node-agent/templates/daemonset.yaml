---
# Source: coroot/charts/node-agent/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coroot-node-agent
  labels:
    helm.sh/chart: node-agent-0.2.15
    app.kubernetes.io/name: node-agent
    app.kubernetes.io/instance: coroot
    app.kubernetes.io/version: "1.23.14"
    app.kubernetes.io/managed-by: Helm
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
      app.kubernetes.io/instance: coroot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
        app.kubernetes.io/instance: coroot
        app: coroot-node-agent
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '80'
    spec:
      
      tolerations: 
        - operator: Exists
      priorityClassName: 
      hostPID: true
      containers:
        - name: node-agent
          image: "ghcr.io/coroot/coroot-node-agent:1.23.14"
          command: ["coroot-node-agent", "--listen=0.0.0.0:80", "--cgroupfs-root", "/host/sys/fs/cgroup"]
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 50Mi
          env:
            - name: TRACES_ENDPOINT
              value: "http://coroot:8080/v1/traces"
            - name: LOGS_ENDPOINT
              value: "http://coroot:8080/v1/logs"
            - name: PROFILES_ENDPOINT
              value: "http://coroot:8080/v1/profiles"
          ports:
            - containerPort: 80
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /host/sys/fs/cgroup
              name: cgroupfs
              readOnly: true
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: false
            - mountPath: /sys/kernel/debug
              name: debugfs
              readOnly: false
            - mountPath: /tmp
              name: tmp
              readOnly: false
      volumes:
        - hostPath:
            path: /sys/fs/cgroup
          name: cgroupfs
        - hostPath:
            path: /sys/kernel/tracing
          name: tracefs
        - hostPath:
            path: /sys/kernel/debug
          name: debugfs
        - emptyDir: {}
          name: tmp
