---
# Source: coroot/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coroot
  labels:
    helm.sh/chart: coroot-0.18.14
    app.kubernetes.io/name: coroot
    app.kubernetes.io/instance: coroot
    app.kubernetes.io/version: "1.8.12"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coroot
      app.kubernetes.io/instance: coroot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coroot
        app.kubernetes.io/instance: coroot
    spec:
      serviceAccountName: coroot
      securityContext:
        {}
      containers:
        - name: coroot
          securityContext:
            {}
          image: "ghcr.io/coroot/coroot:1.8.12"
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
            - --data-dir=/data
            - --bootstrap-prometheus-url=http://coroot-prometheus-server:80
            - --bootstrap-refresh-interval=15s
          env:
            - name: BOOTSTRAP_CLICKHOUSE_ADDRESS
              value: coroot-clickhouse:9000
            - name: BOOTSTRAP_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coroot-clickhouse
                  key: "admin-password"
            - name: BOOTSTRAP_CLICKHOUSE_USER
              value: default
            - name: BOOTSTRAP_CLICKHOUSE_DATABASE
              value: default
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coroot-data
