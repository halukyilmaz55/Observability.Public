          securityContext:
            {}
          image: "ghcr.io/coroot/coroot-cluster-agent:1.0.4"
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN
              value: ":8080"
            - name: COROOT_URL
              value: "http://coroot:8080"
