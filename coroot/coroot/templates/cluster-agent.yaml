              value: "15s"
            - name: METRICS_SCRAPE_TIMEOUT
              value: "10s"
            - name: METRICS_WAL_DIR
              value: ""
            - name: PROFILES_SCRAPE_INTERVAL
              value: "1m"
            - name: PROFILES_SCRAPE_TIMEOUT
              value: "10s"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
          volumeMounts:
            - mountPath: /tmp
              name: tmp
              readOnly: false
